# The heavy queue: process_evidence_document_task (PDF/image
# preprocessing + real Tesseract OCR, issue #8). Scaled and sized
# independently of worker-default-deployment.yaml -- see k8s/README.md
# for why.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolveai-worker-documents
  labels:
    app: resolveai-worker-documents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resolveai-worker-documents
  template:
    metadata:
      labels:
        app: resolveai-worker-documents
    spec:
      containers:
        - name: worker
          image: resolveai-worker:latest # built from backend/Dockerfile.worker
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "-Q", "documents", "--concurrency=2"]
          envFrom:
            - secretRef:
                name: resolveai-secrets
            - configMapRef:
                name: resolveai-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
                - -d
                - "celery@$(HOSTNAME)"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resolveai-worker-documents-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resolveai-worker-documents
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
