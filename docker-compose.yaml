services:
  postgres:
    # Matches .github/workflows/ci.yml's postgres service exactly --
    # previously pg15 here vs pg16 in CI, so this compose setup was never
    # actually running against the same Postgres version the test suite
    # (and Alembic migrations) are validated against.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: resolve_user
      POSTGRES_PASSWORD: resolve_password
      POSTGRES_DB: resolve_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolve_user -d resolve_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # minio/minio on Docker Hub (and the quay.io/minio/minio mirror) no
  # longer resolve for an anonymous pull -- MinIO Inc. discontinued free
  # Docker Hub/quay.io distribution of the AGPLv3 community edition
  # (confirmed: Docker Hub's own API now returns "object not found" for
  # the minio/minio repository, reproduced directly against Hub, not a
  # registry-specific quirk). cgr.dev/chainguard/minio is Chainguard's
  # free, actively-published equivalent, distroless (no shell/curl) --
  # the previous curl-based healthcheck can't run in it, so api/worker
  # now depend on minio only via service_started, not service_healthy;
  # StorageClient's existing BotoCoreError/ClientError handling already
  # degrades gracefully if it's not immediately ready.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Module L: optional/local experiment tracking (frozen PO decision — no
  # live external MLflow, no production credentials). Backed by a local
  # volume, not a managed/hosted service.
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    # Issue #15: mlflow>=3.0 put the bare-filesystem backend store into
    # maintenance mode (it now raises instead of working) -- a sqlite:///
    # URI inside the same mounted volume is the same "local/self-hosted
    # only" decision (no server-managed external DB, no production
    # credential) and isn't deprecated. --default-artifact-root stays a
    # plain path: only the backend *store* (run metadata) was deprecated,
    # never the artifact store.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db --default-artifact-root /mlruns
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlruns

  # Module L: API service (app/main.py), containerized — same code/deps as
  # the existing (non-containerized) dev setup.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # Module L: Celery worker (app/worker/tasks.py etc.), containerized —
  # same code/deps as the existing (non-containerized) dev setup. Issue
  # #17: restart: unless-stopped is this single-host deployment's
  # restart policy for a crashed worker. It consumes both the default
  # and "documents" queues (Dockerfile.worker's CMD) since this is one
  # process -- see k8s/ for the independently-scaled split used anywhere
  # with more than one worker host.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # Module L: Module I frontend, containerized as a static build served by nginx.
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  mlflow_data:
